<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ShopSense — Smart Recommendations</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          colors: {
            brand: { 50: '#ecfdf5', 100: '#d1fae5', 500: '#10b981', 600: '#059669', 700: '#047857' },
          },
        },
      },
    }
  </script>
</head>
<body class="bg-zinc-50 dark:bg-zinc-900 text-zinc-900 dark:text-zinc-100 min-h-screen transition-colors font-sans">

  <nav class="bg-white dark:bg-zinc-800 shadow-sm border-b border-zinc-200 dark:border-zinc-700 sticky top-0 z-10 transition-colors">
    <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
      <a href="/app" class="text-xl font-bold text-zinc-900 dark:text-zinc-100">ShopSense</a>
      <div class="flex items-center gap-6 text-sm font-medium text-zinc-600 dark:text-zinc-300">
        <a href="/app" class="text-zinc-900 dark:text-zinc-100">Home</a>
        <a href="/app/for-you.html" class="hover:text-brand-600 dark:hover:text-brand-500">For You</a>
        <a href="/app/cart.html" class="relative hover:text-brand-600 dark:hover:text-brand-500">
          Cart
          <span id="cart-badge" class="hidden absolute -top-2 -right-3 bg-brand-600 text-white text-[10px] rounded-full w-4 h-4 flex items-center justify-center">0</span>
        </a>
        <button id="theme-toggle" onclick="toggleTheme()" class="text-base hover:scale-110 transition-transform">🌙</button>
      </div>
    </div>
  </nav>

  <main class="max-w-6xl mx-auto px-4 py-8">
    <section class="mb-10">
      <h2 class="text-lg font-semibold text-zinc-900 dark:text-zinc-100 mb-4">Trending Now</h2>
      <div id="popular-grid" class="grid grid-cols-2 md:grid-cols-4 gap-5">
        <p class="text-zinc-400 dark:text-zinc-500 text-sm">Loading...</p>
      </div>
    </section>

    <section class="flex flex-col md:flex-row gap-8">
      <aside class="w-full md:w-56 shrink-0">
        <input id="search-box" type="text" placeholder="Search products..."
               class="w-full border dark:border-zinc-700 dark:bg-zinc-800 dark:text-zinc-100 rounded-lg px-3 py-2 text-sm mb-5 focus:outline-none focus:ring-2 focus:ring-brand-500">

        <div class="mb-5">
          <p class="text-xs font-semibold text-zinc-900 dark:text-zinc-100 uppercase tracking-wide mb-2">Category</p>
          <div id="category-list" class="space-y-1 text-sm text-zinc-600 dark:text-zinc-300"></div>
        </div>

        <div class="mb-5">
          <p class="text-xs font-semibold text-zinc-900 dark:text-zinc-100 uppercase tracking-wide mb-2">Price (₹)</p>
          <div class="flex items-center gap-2">
            <input id="min-price" type="number" placeholder="Min" class="w-full border dark:border-zinc-700 dark:bg-zinc-800 dark:text-zinc-100 rounded-lg px-2 py-1.5 text-sm">
            <span class="text-zinc-400">–</span>
            <input id="max-price" type="number" placeholder="Max" class="w-full border dark:border-zinc-700 dark:bg-zinc-800 dark:text-zinc-100 rounded-lg px-2 py-1.5 text-sm">
          </div>
        </div>

        <div class="mb-5">
          <p class="text-xs font-semibold text-zinc-900 dark:text-zinc-100 uppercase tracking-wide mb-2">Min Rating</p>
          <select id="min-rating" class="w-full border dark:border-zinc-700 dark:bg-zinc-800 dark:text-zinc-100 rounded-lg px-2 py-1.5 text-sm">
            <option value="">Any</option>
            <option value="4.5">4.5+</option>
            <option value="4">4.0+</option>
            <option value="3">3.0+</option>
          </select>
        </div>

        <button id="apply-filters" class="w-full bg-brand-600 text-white text-sm py-2 rounded-lg hover:bg-brand-700">
          Apply Filters
        </button>
        <button id="clear-filters" class="w-full text-zinc-500 dark:text-zinc-400 text-xs py-2 hover:underline">
          Clear all
        </button>
      </aside>

      <div class="flex-1">
        <div class="flex items-center justify-between mb-4">
          <p id="results-count" class="text-sm text-zinc-500 dark:text-zinc-400"></p>
          <select id="sort-select" class="border dark:border-zinc-700 dark:bg-zinc-800 dark:text-zinc-100 rounded-lg px-2 py-1.5 text-sm">
            <option value="">Sort: Default</option>
            <option value="price_asc">Price: Low to High</option>
            <option value="price_desc">Price: High to Low</option>
            <option value="rating_desc">Rating: High to Low</option>
            <option value="popularity">Most Popular</option>
          </select>
        </div>

        <div id="products-grid" class="grid grid-cols-2 lg:grid-cols-3 gap-5">
          <p class="text-zinc-400 dark:text-zinc-500 text-sm">Loading...</p>
        </div>

        <div class="flex items-center justify-center gap-3 mt-8">
          <button id="prev-page" class="text-sm px-3 py-1.5 border dark:border-zinc-700 rounded-lg hover:bg-zinc-100 dark:hover:bg-zinc-800 disabled:opacity-40" disabled>Previous</button>
          <span id="page-info" class="text-sm text-zinc-500 dark:text-zinc-400"></span>
          <button id="next-page" class="text-sm px-3 py-1.5 border dark:border-zinc-700 rounded-lg hover:bg-zinc-100 dark:hover:bg-zinc-800 disabled:opacity-40">Next</button>
        </div>
      </div>
    </section>
  </main>

  <script src="/static/cart.js"></script>
  <script src="/static/theme-toggle.js"></script>
  <script src="/static/currency.js"></script>
  <script src="/static/product-card.js"></script>
  <script src="/static/home.js"></script>
</body>
</html>
